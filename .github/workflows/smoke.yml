name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      # rustc rejects this flag, so the install fails if the job's rustflags reach the build.
      - name: Clean workspace (should pass)
        uses: ./
        env:
          RUSTFLAGS: --flag-that-rustc-rejects
        with:
          path: tests/fixtures/valid_workspace

      - name: Promotion candidate (should warn)
        uses: ./
        with:
          path: tests/fixtures/promotion_candidate

      - name: JSON output
        uses: ./
        with:
          path: tests/fixtures/not_inherited
          format: json
          no-fail: true

      - name: Invalid format (should fail)
        id: invalid-format
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/valid_workspace
          format: yaml

      - name: Promotion failure (should fail)
        id: promotion-failure
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/promotion_candidate
          promotion-failure: true

      - name: Promotion failure, threshold 3 (should pass)
        uses: ./
        with:
          path: tests/fixtures/promotion_candidate
          promotion-failure: true
          promotion-threshold: 3

      - name: Check that the failing steps failed
        if: >-
          steps.invalid-format.outcome != 'failure' ||
          steps.promotion-failure.outcome != 'failure'
        run: |
          echo "Each step marked (should fail) must fail."
          exit 1

      # Runs last, because it rewrites tests/fixtures/version_mismatch.
      - name: Fix
        uses: ./
        with:
          path: tests/fixtures/version_mismatch
          fix: true

      - name: Check that the fix rewrote the member
        run: grep -qxF 'rand = { workspace = true }' tests/fixtures/version_mismatch/crates/bar/Cargo.toml
