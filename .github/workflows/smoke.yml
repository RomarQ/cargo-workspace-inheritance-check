name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Clean workspace (should pass)
        uses: ./
        with:
          path: tests/fixtures/valid_workspace

      - name: Not inherited (should fail)
        id: not-inherited
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/not_inherited

      - name: Version mismatch (should fail)
        id: version-mismatch
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/version_mismatch

      - name: Check that the failing steps failed
        if: steps.not-inherited.outcome != 'failure' || steps.version-mismatch.outcome != 'failure'
        run: |
          echo "The not-inherited and version-mismatch steps must fail."
          exit 1

      - name: Promotion candidate (should warn)
        uses: ./
        with:
          path: tests/fixtures/promotion_candidate

      - name: JSON output
        uses: ./
        with:
          path: tests/fixtures/not_inherited
          format: json
          no-fail: true
