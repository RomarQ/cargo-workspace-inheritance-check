name: "Cargo Workspace Inheritance Check"
description: "Check and enforce workspace dependency inheritance in Cargo workspaces"
author: "Rodrigo Quelhas"

branding:
  icon: "check-circle"
  color: "orange"

inputs:
  path:
    description: "Path to the workspace root"
    required: false
    default: "."
  promotion-threshold:
    description: "Minimum crate count before suggesting workspace promotion"
    required: false
    default: "2"
  promotion-failure:
    description: "Treat promotion candidates as errors"
    required: false
    default: "false"
  format:
    description: "Output format: human or json"
    required: false
    default: "human"
  no-fail:
    description: "Exit 0 even when errors are found"
    required: false
    default: "false"
  fix:
    description: "Automatically fix reported problems"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Build the tool from the action's own ref, so the ref pins the tool. The build goes to the
    # runner's temp folder, because the action's folder can be read-only.
    - name: Install cargo-workspace-inheritance-check
      shell: bash
      # Cargo caps the lints of a crates.io package, but not of a path package. Cap them here
      # too, so the job's rustflags and lint settings cannot fail the install.
      env:
        CARGO_ENCODED_RUSTFLAGS: --cap-lints=allow
      run: cargo install --locked --path "$GITHUB_ACTION_PATH" --target-dir "$RUNNER_TEMP/cargo-workspace-inheritance-check"

    - name: Run cargo-workspace-inheritance-check
      shell: bash
      # Inputs reach the script through env, so their text is never parsed as shell code.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_PROMOTION_THRESHOLD: ${{ inputs.promotion-threshold }}
        INPUT_PROMOTION_FAILURE: ${{ inputs.promotion-failure }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_NO_FAIL: ${{ inputs.no-fail }}
        INPUT_FIX: ${{ inputs.fix }}
      run: |
        args=(--path "$INPUT_PATH" --promotion-threshold "$INPUT_PROMOTION_THRESHOLD" --format "$INPUT_FORMAT")

        if [ "$INPUT_PROMOTION_FAILURE" = "true" ]; then
          args+=(--promotion-failure)
        fi

        if [ "$INPUT_NO_FAIL" = "true" ]; then
          args+=(--no-fail)
        fi

        if [ "$INPUT_FIX" = "true" ]; then
          args+=(--fix)
        fi

        cargo workspace-inheritance-check "${args[@]}"
