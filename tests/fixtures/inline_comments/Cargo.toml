[workspace]
dependencies = {
    # shared versions
    itoa = "1",
}

[dependencies]
before_key = {
    # why this version
    version = "1.0",
}
after_comma = { version = "1.0", # the version
    features = ["x"] }
before_brace = { version = "1.0",
    features = ["x"], # the features
}
dotted = { version = "1.0",
    # before a dotted key
    x.y = 1 }
nested = { version = "1.0", x = {
    # inside a nested table
    y = 1 } }
multi_line = { version = "1.0",
    features = ["x"] }
in_array = { version = "1.0", features = [
    "x", # the feature
] }
after_entry = { version = "1.0" } # after the entry
